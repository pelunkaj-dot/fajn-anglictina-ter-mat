<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fff8ef">
  <title>Angličtina s Terezkou a Matýskem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" id="homeBtn" aria-label="Domů">🇬🇧 <span>Angličtina s Terezkou a Matýskem</span></button>
    <div class="topstats">
      <span id="stars">⭐ 0</span>
      <span id="mastered">🏅 0</span>
    </div>
  </header>

  <main id="app" class="app" aria-live="polite"></main>

  <template id="homeTemplate">
    <section class="hero">
      <div>
        <p class="eyebrow">ANGLIČTINA PRO MLADŠÍ ŠKOLÁKY</p>
        <h1>Učím se. Rozumím. Mluvím.</h1>
        <p>Žádné bloudění mezi tlačítky. Vyber téma a projdi cestu od prvního slova až k vlastnímu mluvení.</p>
      </div>
      <div class="characters" aria-label="Terezka a Matýsek">
        <div class="character-portrait">
          <img src="assets/characters/terezka.svg" alt="Terezka">
          <span>Terezka</span>
        </div>
        <div class="character-portrait matysek-portrait">
          <img src="assets/characters/matysek.svg" alt="Matýsek">
          <span>Matýsek</span>
        </div>
      </div>
    </section>

    <section class="world-card">
      <div class="world-copy">
        <div>
          <p class="eyebrow">SVĚT TEREZKY A MATÝSKA</p>
          <h2>🌍 Náš svět</h2>
          <p id="worldText">Každé opravdu zvládnuté téma svět trochu oživí.</p>
        </div>
        <button class="adventure-btn" id="adventureBtn">🎮 Vyrazit na výpravu</button>
      </div>

      <div class="world-scene" id="worldScene" aria-label="Klikací svět Terezky a Matýska">
        <div class="sky-sun">☀️</div>
        <div class="cloud cloud-a">☁️</div>
        <div class="cloud cloud-b">☁️</div>

        <button class="world-place place-colours unlock-colours" data-topic="colours" aria-label="Barvy">
          <span class="place-icon">🌈</span><span class="place-name">Barvy</span><span class="place-lock">🔒</span>
        </button>
        <button class="world-place place-animals unlock-animals" data-topic="animals" aria-label="Zvířata">
          <span class="place-icon">🌳🐶</span><span class="place-name">Zvířata</span><span class="place-lock">🔒</span>
        </button>
        <button class="world-place place-food unlock-food" data-topic="food" aria-label="Jídlo">
          <span class="place-icon">🧺🍎</span><span class="place-name">Piknik</span><span class="place-lock">🔒</span>
        </button>
        <button class="world-place place-numbers unlock-numbers" data-topic="numbers" aria-label="Čísla">
          <span class="place-icon">1 2 3</span><span class="place-name">Čísla</span><span class="place-lock">🔒</span>
        </button>
        <button class="world-place place-body unlock-body" data-topic="body" aria-label="Tělo">
          <span class="place-icon">🙌</span><span class="place-name">Tělo</span><span class="place-lock">🔒</span>
        </button>
        <button class="world-place place-family unlock-family" data-topic="family" aria-label="Rodina">
          <span class="place-icon">❤️</span><span class="place-name">Rodina</span><span class="place-lock">🔒</span>
        </button>
        <button class="world-place place-clothes unlock-clothes" data-topic="clothes" aria-label="Oblečení">
          <span class="place-icon">👕🧦</span><span class="place-name">Oblečení</span><span class="place-lock">🔒</span>
        </button>
        <button class="world-place place-house unlock-house" data-topic="house" aria-label="Dům">
          <span class="place-icon">🏡</span><span class="place-name">Dům</span><span class="place-lock">🔒</span>
        </button>
        <button class="world-place place-school unlock-school" data-topic="school" aria-label="Škola">
          <span class="place-icon">🏫</span><span class="place-name">Škola</span><span class="place-lock">🔒</span>
        </button>

        <div class="world-friends">
          <img src="assets/characters/terezka.svg" alt="Terezka">
          <img src="assets/characters/matysek.svg" alt="Matýsek">
        </div>
        <div class="world-ground"></div>
        <div class="world-tip" id="worldTip" aria-live="polite"></div>
      </div>

      <div class="world-progress"><span id="worldFill"></span></div>
    </section>

    <section class="game-teaser">
      <div class="game-icon">🗺️</div>
      <div>
        <p class="eyebrow">HERNÍ REŽIM</p>
        <h2>Výprava za ztracenými hvězdami</h2>
        <p>Správné odpovědi posouvají Terezku a Matýska po cestě. Žádné životy, žádné tresty — ale cesta, poklad a rekord ano.</p>
      </div>
      <button class="btn primary" id="gameBtn">Hrát</button>
    </section>

    <section>
      <h2 class="section-title">Vyber si téma</h2>
      <div id="topics" class="topics"></div>
    </section>
  </template>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="visuals.js"></script>
  <script src="young-learners.js"></script>
  <script src="game-voice.js"></script>
  <script src="story-roleplay.js"></script>
  <script src="topic-expansion.js"></script>
  <script src="picture-topics.js"></script>
  <script src="world-map.js"></script>
</body>
</html>
